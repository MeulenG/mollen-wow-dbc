name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel older in-progress runs when a new commit lands on the
# same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Windows, Debug)
    runs-on: windows-latest

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      # PSQL off: the runner has no vcpkg/pqxx. db_config (toml) and the
      # enum registry still get full test coverage.
      - name: Configure
        run: cmake -B build -S . -DMOLLEN_DBC_ENABLE_PSQL=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
